<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Silhouette Score: a within, b between</title>
  <desc id="desc">A highlighted point P connects to the other points in its own coral cluster for a, and to every point in the nearest other teal cluster for b. Each quantity is an average of the corresponding distances.</desc>
  <rect width="1200" height="675" fill="#f6f4ee"/>
  <g font-family="Arial, sans-serif" fill="#102a43">
    <text x="64" y="78" font-size="22" letter-spacing="4">ML / DL CONCEPTS</text>
    <text x="64" y="149" font-size="62" font-weight="700">Silhouette Score</text>
    <text x="64" y="194" font-size="26">How well does a point fit its cluster?</text>
    <ellipse cx="278" cy="382" rx="182" ry="143" fill="#ffe1d9" stroke="#e57662" stroke-width="2" stroke-dasharray="8 8"/>
    <ellipse cx="902" cy="382" rx="182" ry="143" fill="#d6eee8" stroke="#238775" stroke-width="2" stroke-dasharray="8 8"/>
    <g stroke="#238775" stroke-width="3" opacity=".55">
      <path d="M340 385L810 325M340 385L907 290M340 385L985 370M340 385L855 440M340 385L970 465"/>
    </g>
    <g stroke="#d85e49" stroke-width="4">
      <path d="M340 385L220 300M340 385L170 390M340 385L265 455M340 385L325 280"/>
    </g>
    <g fill="#dc6c55" stroke="#fff" stroke-width="3">
      <circle cx="220" cy="300" r="13"/><circle cx="170" cy="390" r="13"/><circle cx="265" cy="455" r="13"/><circle cx="325" cy="280" r="13"/>
    </g>
    <g fill="#238775" stroke="#fff" stroke-width="3">
      <circle cx="810" cy="325" r="13"/><circle cx="907" cy="290" r="13"/><circle cx="985" cy="370" r="13"/><circle cx="855" cy="440" r="13"/><circle cx="970" cy="465" r="13"/>
    </g>
    <circle cx="340" cy="385" r="19" fill="#102a43" stroke="white" stroke-width="5"/>
    <text x="360" y="425" font-size="28" font-weight="700">P</text>
    <rect x="230" y="339" width="50" height="47" rx="10" fill="#fff"/>
    <text x="244" y="373" fill="#bd4835" font-size="36" font-weight="700">a</text>
    <rect x="548" y="345" width="70" height="57" rx="10" fill="#fff"/>
    <text x="571" y="386" fill="#176f60" font-size="42" font-weight="700">b</text>
    <text x="278" y="565" text-anchor="middle" font-size="26" font-weight="700">a · Intra-cluster</text>
    <text x="278" y="600" text-anchor="middle" font-size="22">Average distance within</text>
    <text x="902" y="565" text-anchor="middle" font-size="26" font-weight="700">b · Inter-cluster</text>
    <text x="902" y="600" text-anchor="middle" font-size="22">Average to nearest other cluster</text>
    <text x="600" y="651" text-anchor="middle" font-size="23">Small a + large b = a better fit</text>
  </g>
</svg>
