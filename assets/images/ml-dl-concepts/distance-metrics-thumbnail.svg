<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Euclidean versus Manhattan distance</title><desc id="desc">A straight diagonal has length five, while the route three across and four up has length seven.</desc><rect width="1200" height="675" fill="#f6f4ee"/><g font-family="Arial, sans-serif" fill="#102a43"><text x="64" y="75" font-size="22" letter-spacing="4">ML / DL CONCEPTS</text><text x="64" y="146" font-size="57" font-weight="700">What does close mean?</text><text x="64" y="194" font-size="27">Distance measures in machine learning</text><path d="M140 280H500M140 350H500M140 420H500M140 490H500M140 560H500M140 280V560M230 280V560M320 280V560M410 280V560M500 280V560" stroke="#d5ddd9" stroke-width="2"/><path d="M170 550H380V270" fill="none" stroke="#238775" stroke-width="9"/><path d="M170 550L380 270" stroke="#d85e49" stroke-width="9"/><circle cx="170" cy="550" r="11"/><circle cx="380" cy="270" r="11"/><text x="120" y="595" font-size="25">A (2, 3)</text><text x="400" y="265" font-size="25">B (5, 7)</text><text x="265" y="535" font-size="25">3</text><text x="400" y="430" font-size="25">4</text><text x="235" y="385" font-size="27" fill="#b84232">5</text><path d="M650 315H715" stroke="#d85e49" stroke-width="8"/><text x="740" y="325" font-size="31" font-weight="700">Euclidean = 5</text><text x="740" y="365" font-size="23">The straight line</text><path d="M650 435H680V410H715" fill="none" stroke="#238775" stroke-width="8"/><text x="740" y="435" font-size="31" font-weight="700">Manhattan = 7</text><text x="740" y="475" font-size="23">3 across + 4 up</text><text x="650" y="575" font-size="22">Same points. Different geometry.</text></g></svg>